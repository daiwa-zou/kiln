name: security

on:
  push:
    branches: [main]
  pull_request:
  # New CVEs land against code that has not changed, so the cron is the part
  # of this workflow that actually earns its keep.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reports only vulnerabilities reachable from kiln's own call graph, so it
  # stays quiet about CVEs in unused corners of the dependency tree.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.25 patch, not go.mod's literal 1.25.0 -- that release
          # ships 22 stdlib CVEs this job would (correctly) fail on.
          go-version: '1.25.x'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # kiln handles ANTHROPIC_API_KEY (internal/config/secrets.go) and Postgres
  # DSNs, so a secret landing in a commit is a live risk.
  #
  # The gitleaks binary is installed directly rather than via gitleaks-action,
  # which gates scanning behind a GITLEAKS_LICENSE secret.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history on the scheduled sweep; the default shallow checkout
          # is enough for a push or PR.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
      - name: Install gitleaks
        # Pinned rather than resolved from the releases API at run time. That
        # lookup is unauthenticated, and a rate-limited response carries no
        # tag_name -- which produced an empty version, a 404 download, and a
        # *failing secret scan* that looked like a finding. A security gate
        # must not break because an upstream API throttled us; upgrades here
        # are deliberate, and the checksum proves we got what we pinned --
        # a scanner fetched over the network is itself supply chain.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
          gitleaks version
      - name: Scan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            gitleaks git --redact --verbose .
          else
            gitleaks dir --redact --verbose .
          fi
