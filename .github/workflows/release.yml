name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload archives

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: release binaries should not ship a stdlib with
          # known CVEs, which go.mod's literal 1.26.0 would. check-latest, or
          # setup-go takes the runner image's cached patch, which can lag one.
          go-version: '1.26.x'
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
