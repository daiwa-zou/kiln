name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded push to a PR has nothing useful left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The latest 1.26 patch, deliberately not `go-version-file: go.mod`: setup-go
# installs the go directive literally, and a .0 release ships stdlib CVEs
# fixed in later patches (1.25.0 had 22 reachable ones) that the security
# workflow rightly fails on. This tracks go.mod's minor line -- bump both
# together, along with security.yml, release.yml and the Dockerfile. GOTOOLCHAIN
# is local, so a go.mod that moves alone fails every job before it compiles.
env:
  GO_VERSION: '1.26.x'

jobs:
  # golangci-lint subsumes the old `go vet` and `gofmt` steps: govet is in the
  # standard linter set and gofmt/goimports run as v2 formatters.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      # A dirty go.mod/go.sum breaks reproducible builds long before it breaks
      # a test, so catch the drift here rather than in review.
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Hermetic: no network, no database. The store and API integration tests
  # skip themselves when KILN_TEST_DATABASE_URL is unset. Same gate as
  # `make test` locally.
  #
  # Deliberately without -race. What this job proves that no other does is that
  # the suite passes with nothing to connect to -- that the skips are real and
  # a contributor without Postgres is not staring at failures. Race coverage is
  # not part of that: `integration` runs every test this one runs, with -race,
  # plus the ones needing a database, so running the detector here a second
  # time bought no finding it would not have made and cost more than a minute
  # of every pipeline.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...

  # Everything, including the schema and API tests that need Postgres. Without
  # this job the store layer is effectively unreviewed by machines.
  #
  # Coverage is measured here rather than in `test` because it is the only run
  # that exercises internal/store -- the hermetic profile reports it at ~5% and
  # would understate the project badge by a wide margin.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KILN_TEST_DATABASE_URL: postgres://kiln:kiln@localhost:55432/kiln?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # -p 1 is required, not a tuning knob: internal/api and internal/store
      # both DROP SCHEMA public on the one shared database, so running their
      # test binaries in parallel makes each tear the schema out from under
      # the other mid-migration.
      #
      # -coverpkg makes attribution cross-package: without it, store code
      # exercised by api tests counts for nothing and the readstore looks
      # untested when it is merely tested from one package over.
      - run: go test -race ./... -count=1 -p 1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $NF }')
          echo "### Coverage: ${total}" >>"$GITHUB_STEP_SUMMARY"
          echo '' >>"$GITHUB_STEP_SUMMARY"
          echo 'Twenty least-covered functions:' >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | grep -v '^total:' | sort -t'	' -k3 -n | head -20 >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
      # Uploaded before the floor gate, and with if: always(), so a failing
      # floor still leaves the profile downloadable -- that is exactly when
      # you want to inspect it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
      # Set just under the measured baseline (81.7% with -coverpkg union
      # attribution): a ratchet against regressions, not a target to chase.
      # Raise this as the real number moves up.
      - name: Coverage floor
        env:
          COVERAGE_FLOOR: '78.0'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/,"",$NF); print $NF }')
          echo "coverage ${total}%, floor ${COVERAGE_FLOOR}%"
          # `if` keeps the comparison exempt from `set -e`: as a bare `&&` list
          # the short-circuit case returns non-zero and would fail the step
          # precisely when coverage is fine.
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t < f) ? 0 : 1 }'; then
            echo "::error::coverage ${total}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi

  # The integration suite again, through PgBouncer in transaction mode: the
  # proof that nothing kiln does relies on session state across transactions.
  # Both exec modes a pooled deployment may pick are run. cache_describe is the
  # pooled default; cache_statement is pgx's default, which works only because
  # PgBouncer tracks prepared statements (max_prepared_statements).
  #
  # No coverage here: `integration` already measures it, and this job's point
  # is a different path to the same assertions. KILN_TEST_DIRECT_DATABASE_URL
  # lets TestMigrateLeavesNoSessionLocks look past the pooler at pg_locks.
  #
  # If the suite deadlocks on the server pool, raise default_pool_size; never
  # patch a test to fit the pool.
  integration-pooled:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cache_describe runs against a PgBouncer that does not track prepared
        # statements, like RDS Proxy: if the mode failed to reach pgx, its named
        # statements would collide (42P05) and the leg would fail. Without
        # this both legs pass whatever mode is in effect.
        include:
          - mode: cache_describe
            prepared_statements: 0
          - mode: cache_statement
            prepared_statements: 200
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Bump with the Makefile's POOLER_IMAGE, docker-compose.yml and the chart.
      PGBOUNCER_IMAGE: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
      KILN_TEST_DIRECT_DATABASE_URL: postgres://kiln:kiln@localhost:55432/kiln?sslmode=disable
      KILN_TEST_DATABASE_URL: postgres://kiln:kiln@localhost:56432/kiln?sslmode=disable&default_query_exec_mode=${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # The repository's own pgbouncer.ini and start.sh, the same ones the
      # compose stack runs, with only the listen port and the wait budget
      # overridden for CI.
      - name: Start PgBouncer
        run: |
          docker run -d --name pgbouncer --network host \
            -v "$PWD/deploy/pgbouncer:/etc/pgbouncer:ro" \
            -e PGBOUNCER_DB_HOST=127.0.0.1 -e PGBOUNCER_DB_PORT=55432 \
            -e PGBOUNCER_DB_NAME=kiln -e PGBOUNCER_DB_PASSWORD=kiln \
            -e PGBOUNCER_SET="listen_port=56432 default_pool_size=20 query_wait_timeout=10 max_prepared_statements=${{ matrix.prepared_statements }}" \
            --entrypoint /bin/sh "$PGBOUNCER_IMAGE" /etc/pgbouncer/start.sh
          # Ready means a query made it through to Postgres, not just that
          # PgBouncer is listening.
          for i in $(seq 1 30); do
            if docker exec pgbouncer psql 'postgres://kiln:kiln@127.0.0.1:56432/kiln?sslmode=disable' -qtAc 'select 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pgbouncer
          echo "::error::pgbouncer never passed a query through"
          exit 1
      - run: go test -race ./... -count=1 -p 1
      - name: PgBouncer log
        if: failure()
        run: docker logs pgbouncer 2>&1 | tail -200

  # The chart has no cluster to deploy to in CI, so it is checked by rendering:
  # helm lint, then assertions over `helm template` output (the pooler wiring,
  # the migrate Job going direct, no credential in a ConfigMap) and a
  # kubeconform schema check of every render.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # helm and yq are preinstalled on ubuntu-latest; kubeconform is run with
      # `go run` at the version pinned in scripts/helm-assert.sh.
      - run: make helm-test

  # Proves the ldflags version injection still wires up, which no test covers.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `make build` shells out to `git describe --tags`, which needs the
          # tags but not the history behind them. Fetching the tags onto a
          # shallow clone answers it without cloning the whole repository.
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build
      - name: Smoke test
        run: |
          version=$(./bin/kiln version)
          test -n "$version" || { echo "kiln version printed nothing"; exit 1; }
          echo "built kiln $version"
          ./bin/kiln --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: kiln-linux-amd64
          path: bin/kiln
          retention-days: 14

  # Regenerates the committed badge SVG. Only on main: PR runs have nothing to
  # commit to, and a fork PR would not have the token anyway.
  coverage-badge:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - run: ./scripts/coverage-badge.sh coverage.out .github/badges/coverage.svg
      - name: Commit if changed
        run: |
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "badge unchanged"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badges/coverage.svg
          git commit -m 'ci: update coverage badge [skip ci]'
          git push
