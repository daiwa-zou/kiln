# A complete kiln deployment: Postgres behind PgBouncer, S3-compatible object
# storage, the API with its embedded reading UI, a pool of build workers, and
# one scheduler for the periodic duties.
#
# The topology is the point. `kiln serve --with-worker` exists for a laptop,
# but this file runs the API and the workers as separate services because that
# is how the system scales: the API is stateless and scales for readers, the
# workers claim from the runs table (FOR UPDATE SKIP LOCKED) and scale for
# builds. `docker compose up --scale worker=4` adds build throughput without
# touching the API, and no broker is involved.
#
#   cp .env.example .env   # fill in KILN_MASTER_KEY and KILN_ANTHROPIC_API_KEY
#   docker compose up -d
#   docker compose exec api kiln admin token create --login you --scopes read,write,admin
#   open http://localhost:8080   # paste the token when the UI asks
#
# The stack requires a token. Not as a nicety: inside a container the server
# must bind every interface to be reachable at all, and kiln refuses to serve
# a wide-open bind with auth disabled -- because there the container boundary,
# not the listen address, is what limits reach, and the process cannot tell a
# published port from a private one. auth.mode = none stays a localhost
# convenience for `make dev`, never a deployment default.

name: kiln

x-kiln-env: &kiln-env
  # Direct to Postgres. Only migrate uses this as-is; the API and workers
  # override it below to go through the pooler.
  KILN_DATABASE_URL: postgres://kiln:${POSTGRES_PASSWORD:-kiln}@postgres:5432/kiln?sslmode=disable
  KILN_STORAGE_BACKEND: s3
  KILN_STORAGE_ENDPOINT: minio:9000
  KILN_STORAGE_BUCKET: ${KILN_STORAGE_BUCKET:-kiln}
  KILN_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-kilnminio}
  KILN_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kilnminio}
  KILN_STORAGE_USE_SSL: "false"
  KILN_STORAGE_PATH_STYLE: "true"
  KILN_LOG_LEVEL: ${KILN_LOG_LEVEL:-info}
  # Sealing key for connector credentials, and the model key the agent spends
  # against. Both are required; see .env.example.
  KILN_MASTER_KEY: ${KILN_MASTER_KEY:?set KILN_MASTER_KEY in .env (openssl rand -hex 32)}
  KILN_ANTHROPIC_API_KEY: ${KILN_ANTHROPIC_API_KEY:-}
  # Generation knobs worth reaching without editing this file: the runner
  # ("api", or "fake" to exercise the whole pipeline at zero spend), the
  # models, and the spend caps. Empty values are ignored rather than applied,
  # so an unset variable here keeps kiln's own default.
  KILN_AGENT_RUNNER: ${KILN_AGENT_RUNNER:-}
  KILN_AGENT_MODEL: ${KILN_AGENT_MODEL:-}
  KILN_AGENT_RUN_BUDGET_USD: ${KILN_AGENT_RUN_BUDGET_USD:-}
  KILN_AGENT_MAX_PAGES_PER_RUN: ${KILN_AGENT_MAX_PAGES_PER_RUN:-}
  KILN_AGENT_BUDGET_WINDOW: ${KILN_AGENT_BUDGET_WINDOW:-}
  # How long a worker lets its in-flight build run after SIGTERM before
  # interrupting and requeueing it. Pinned here because the compiled-in default
  # (15m) is longer than the worker's stop_grace_period below: Docker would
  # SIGKILL the worker mid-drain, and the run would sit 'running' until the
  # stale deadline. Keep it under that stop_grace_period.
  KILN_WORKER_DRAIN_GRACE: ${KILN_WORKER_DRAIN_GRACE:-4m}
  # Prometheus metrics on a second listener, deliberately not published to the
  # host: scrape it from inside the compose network, or publish it yourself
  # once you know who can reach it. kiln's own default is loopback-only, which
  # inside a container would be unreachable even from the compose network, so
  # the wide bind is stated here where the network is the boundary.
  KILN_METRICS_ADDR: ${KILN_METRICS_ADDR:-:9090}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiln}
      POSTGRES_DB: kiln
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Gated on the real user and database, not just a listening port: an
      # initializing Postgres accepts connections before it is usable.
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Transaction pooling in front of Postgres, so `--scale worker=N` and more API
  # replicas multiply cheap pooler clients rather than Postgres backends. The
  # settings are deploy/pgbouncer/pgbouncer.ini; start.sh writes the userlist
  # from POSTGRES_PASSWORD at start, so no credential is baked into a file.
  # Migrations skip it and go direct (see migrate).
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    # The image's own entrypoint rewrites files under /etc/pgbouncer, which is
    # mounted read-only here.
    entrypoint: ["/bin/sh", "/etc/pgbouncer/start.sh"]
    environment:
      PGBOUNCER_DB_HOST: postgres
      PGBOUNCER_DB_NAME: kiln
      PGBOUNCER_DB_PASSWORD: ${POSTGRES_PASSWORD:-kiln}
      # The bundled Postgres has no TLS, so the pooler uses prefer. Pointed at
      # a Postgres across a network, require (or verify-full) instead:
      # PGBOUNCER_SERVER_TLS_SSLMODE: require
    volumes:
      - ./deploy/pgbouncer:/etc/pgbouncer:ro
    depends_on:
      postgres:
        condition: service_healthy
    # The listener only: PgBouncer answers pg_isready whether or not Postgres
    # is up, so this gates on the pooler having started, nothing more.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "kiln", "-d", "kiln"]
      interval: 5s
      timeout: 3s
      retries: 20
    # SIGINT is PgBouncer's safe shutdown: it lets in-flight transactions
    # finish before closing server connections. SIGTERM would wait for every
    # client to disconnect, which pooled kiln processes never do on their own.
    stop_signal: SIGINT
    # Room for that wait. Docker sends SIGKILL when it runs out, and whatever
    # transaction is still open then fails.
    stop_grace_period: 120s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kilnminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kilnminio}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001" # console; the API talks to :9000 on the network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: create the uploads bucket, then exit. Uploads answer 503 with a
  # clear message if the bucket is missing, so this failing is visible rather
  # than mysterious.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kilnminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kilnminio}
      KILN_STORAGE_BUCKET: ${KILN_STORAGE_BUCKET:-kiln}
    entrypoint: >
      /bin/sh -c "
      mc alias set kiln http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing kiln/$$KILN_STORAGE_BUCKET
      "

  # Migrations run as their own service rather than on server boot: schema
  # changes are an operator decision, the advisory lock makes concurrent runs
  # safe, and both API and workers refuse to start against an unexpected
  # version -- so this must succeed before they come up. It connects to
  # Postgres directly: DDL gains nothing from a pooler.
  migrate:
    image: ${KILN_IMAGE:-ghcr.io/daiwa-zou/kiln:latest}
    build:
      context: .
      args:
        VERSION: ${KILN_VERSION:-compose}
    command: ["admin", "migrate"]
    environment: *kiln-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${KILN_IMAGE:-ghcr.io/daiwa-zou/kiln:latest}
    build:
      context: .
      args:
        VERSION: ${KILN_VERSION:-compose}
    command: ["serve"]
    environment:
      <<: *kiln-env
      # Through the pooler. cache_describe leaves no named prepared statement
      # on a server connection, and a single-digit pool per process is plenty
      # when each connection is held only for a transaction.
      KILN_DATABASE_URL: postgres://kiln:${POSTGRES_PASSWORD:-kiln}@pgbouncer:6432/kiln?sslmode=disable
      KILN_DATABASE_QUERY_EXEC_MODE: ${KILN_DATABASE_QUERY_EXEC_MODE:-cache_describe}
      KILN_DATABASE_MAX_CONNS: "8"
      KILN_HTTP_ADDR: ":8080"
      # Tokens by default. Mint the first one after the stack is up:
      #   docker compose exec api kiln admin token create --login you \
      #     --scopes read,write,admin
      KILN_AUTH_MODE: ${KILN_AUTH_MODE:-token}
      # Read by that token create (it runs in this container); empty keeps
      # kiln's default, member.
      KILN_AUTH_DEFAULT_ROLE: ${KILN_AUTH_DEFAULT_ROLE:-}
      KILN_PUBLIC_URL: ${KILN_PUBLIC_URL:-http://localhost:8080}
      # Empty: rate limits key on the TCP peer. Set it to your proxy's
      # address when one sits in front (see docs/deployment.md).
      KILN_TRUSTED_PROXIES: ${KILN_TRUSTED_PROXIES:-}
    ports:
      - "${KILN_BIND_ADDR:-127.0.0.1}:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      # /readyz reports database reachability; /healthz answers even when the
      # database is down, which is deliberately not what "ready" means.
      test: ["CMD", "/usr/local/bin/kiln", "admin", "health", "--addr", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # The scaling unit: `docker compose up -d --scale worker=4`. Each worker
  # claims one run at a time (builds are LLM-bound, so per-process concurrency
  # would multiply spend rather than throughput) and identifies itself in
  # runs.claimed_by by hostname, which Compose makes unique per replica.
  worker:
    image: ${KILN_IMAGE:-ghcr.io/daiwa-zou/kiln:latest}
    build:
      context: .
      args:
        VERSION: ${KILN_VERSION:-compose}
    command: ["worker"]
    environment:
      <<: *kiln-env
      KILN_DATABASE_URL: postgres://kiln:${POSTGRES_PASSWORD:-kiln}@pgbouncer:6432/kiln?sslmode=disable
      KILN_DATABASE_QUERY_EXEC_MODE: ${KILN_DATABASE_QUERY_EXEC_MODE:-cache_describe}
      KILN_DATABASE_MAX_CONNS: "4"
      # The scheduler service runs the requeue, polling, sweeps and the queue
      # gauge, so workers only claim and build however many there are.
      KILN_WORKER_SCHEDULER_DUTIES: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    # SIGTERM starts the drain: the worker stops claiming immediately and the
    # in-flight build gets KILN_WORKER_DRAIN_GRACE (4m, above) before being
    # requeued. This must stay above that grace, or Docker's SIGKILL lands
    # mid-drain and the run is left 'running' until it goes stale.
    stop_grace_period: 5m
    restart: unless-stopped

  # The periodic duties, once for the stack: requeueing runs whose worker died,
  # enqueueing poll-triggered sources, the hourly GC sweep with the pending
  # blob deletes, and the kiln_queue_depth gauge. Run exactly one -- do not
  # --scale it. It needs the database and object storage, never the master
  # key or the model key, so those are blanked here.
  scheduler:
    image: ${KILN_IMAGE:-ghcr.io/daiwa-zou/kiln:latest}
    build:
      context: .
      args:
        VERSION: ${KILN_VERSION:-compose}
    command: ["scheduler"]
    environment:
      <<: *kiln-env
      KILN_DATABASE_URL: postgres://kiln:${POSTGRES_PASSWORD:-kiln}@pgbouncer:6432/kiln?sslmode=disable
      KILN_DATABASE_QUERY_EXEC_MODE: ${KILN_DATABASE_QUERY_EXEC_MODE:-cache_describe}
      KILN_DATABASE_MAX_CONNS: "2"
      KILN_MASTER_KEY: ""
      KILN_ANTHROPIC_API_KEY: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      # The metrics listener's /readyz: ready once the first pass of the
      # duties has finished. Needs KILN_METRICS_ADDR set (it is, above).
      test: ["CMD", "/usr/local/bin/kiln", "admin", "health", "--addr", "http://127.0.0.1:9090"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
