<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%23b4530a'/%3E%3Cpath fill='%23faf7f2' fill-rule='evenodd' d='M5,20V11.5Q5,4,12,4Q19,4,19,11.5V20ZM9,20V14.5Q9,11,12,11Q15,11,15,14.5V20Z'/%3E%3C/svg%3E">
<title>kiln</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<!-- Symbol definitions only. Taken out of flow: an inline <svg>, even at zero
     size, still generates a line box, and the ~20px it added at the top of the
     document threw off every height computed from 100vh below it. -->
<svg class="defs" width="0" height="0" aria-hidden="true">
  <symbol id="logo-mark" viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M3 22 L3 12 Q3 2 12 2 Q21 2 21 12 L21 22 Z
      M8 22 L8 15 Q8 10 12 10 Q16 10 16 15 L16 22 Z
      M9.8 18.5 a2.2 2.2 0 1 0 4.4 0 a2.2 2.2 0 1 0 -4.4 0 Z"/>
  </symbol>
</svg>
<a class="skip" href="#main">Skip to content</a>
<div id="wizard" class="palette" hidden>
  <div class="palette-panel wizard-panel" role="dialog" aria-modal="true" aria-label="Add a source">
    <div id="wizard-body"></div>
  </div>
</div>
<div id="help" class="palette" hidden>
  <div class="palette-panel help-panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="wizard-head">
      <strong id="help-title"></strong>
      <button class="wizard-x" id="help-x" aria-label="Close">×</button>
    </div>
    <div id="help-body"></div>
  </div>
</div>
<!-- The command palette. One box for both halves of finding something: it
     jumps to a page, runs an action, and hands the query off to full-text
     search, so the rail's filter can stay the narrow thing it is. -->
<div id="palette" class="palette" hidden>
  <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Search pages, sources, actions">
    <div class="cmd-input-row">
      <svg class="cmd-glyph" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M6.9 1.4a5.5 5.5 0 1 0 3.3 9.9l3.1 3.1 1.3-1.3-3.1-3.1a5.5 5.5 0 0 0-4.6-8.6zm0 1.9a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 0 1 0-7.2z"/></svg>
      <input id="palette-input" type="text" role="combobox" aria-expanded="true"
             aria-label="Search pages, sources, actions"
             aria-controls="palette-list" aria-autocomplete="list" autocomplete="off"
             spellcheck="false" placeholder="Search pages, sources, actions…">
      <kbd>esc</kbd>
    </div>
    <ul id="palette-list" role="listbox"></ul>
  </div>
</div>

<!-- Sticky chrome. Build state is the one piece of state that changes while
     you are elsewhere in the app, so it lives here rather than only on the
     Ingest view. -->
<header class="topbar">
  <button class="menu-btn" id="menu" aria-label="Navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
  <div class="brand"><svg class="logo" aria-hidden="true"><use href="#logo-mark"/></svg><span>kiln</span></div>
  <!-- A details, not a select: an open select popup is OS-drawn, ignores the
       clay palette, and overlays whatever sits below it. -->
  <details class="bench" id="bench">
    <summary id="bench-name" aria-label="Bench"><span class="bench-dot" aria-hidden="true"></span><span id="bench-label"></span><span class="bench-caret" aria-hidden="true">▾</span></summary>
    <div class="bench-list" id="bench-list"></div>
  </details>
  <button class="cmd-trigger" id="cmd-trigger" aria-label="Search pages, sources, actions">
    <svg class="cmd-glyph" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M6.9 1.4a5.5 5.5 0 1 0 3.3 9.9l3.1 3.1 1.3-1.3-3.1-3.1a5.5 5.5 0 0 0-4.6-8.6zm0 1.9a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 0 1 0-7.2z"/></svg>
    <span class="cmd-trigger-text">Search pages, sources, actions…</span>
    <kbd id="cmd-key">⌘K</kbd>
  </button>
  <div class="topbar-end">
    <button class="run-pill" id="run-pill" aria-expanded="false" aria-controls="run-pop" hidden></button>
    <details class="footer-menu" id="account">
      <summary class="avatar" id="avatar" aria-label="Account"></summary>
      <div class="footer-sheet" id="account-menu">
        <div class="footer-sheet-label">Bench</div>
        <a href="#/members" data-view="members">Members</a>
        <a href="#/mcp" data-view="mcp">Agent access (MCP)</a>
        <div class="footer-sheet-label">Account</div>
        <div class="account-who" id="account-who"></div>
        <button class="signout" id="signout" hidden>Sign out of this kiln</button>
        <div class="sheet-version">kiln <span id="version"></span></div>
      </div>
    </details>
  </div>
</header>
<div id="run-pop" class="run-pop" hidden></div>

<div class="shell">
  <aside id="sidebar" aria-label="Sidebar">
    <nav class="nav" aria-label="Views">
      <div class="group-label">Read</div>
      <a href="#/overview" data-view="overview"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg><span>Overview</span></a>
      <a href="#/index" data-view="index"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v1.6H2zM2 7.2h12v1.6H2zM2 11.4h8v1.6H2z"/></svg><span>Index</span></a>
      <a href="#/graph" data-view="graph"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3.4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm8 5.2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM11.6 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM5.6 5.2h4.8v1.2H5.6zM5.4 6.6l5.6 3.6-.7 1L4.7 7.6z"/></svg><span>Graph</span></a>
      <div class="group-label group-tend">Tend</div>
      <a href="#/reviews" data-view="reviews"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M2 2h12v9H8.8L5.6 14v-3H2V2z"/></svg><span>Reviews</span><span class="badge" id="reviews-badge" hidden></span></a>
      <a href="#/ingest" data-view="sources"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2h13l-5 6.2V14L6.5 12V8.2z"/></svg><span>Ingest</span><span class="nav-live" id="ingest-live" hidden></span></a>
      <a href="#/log" data-view="log"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M3 1h10v14H3V1zm2 3h6v1.4H5V4zm0 3.3h6v1.4H5V7.3zm0 3.3h4v1.4H5v-1.4z"/></svg><span>Log</span></a>
      <a href="#/steering" data-view="steering"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 1.4a6.6 6.6 0 1 0 0 13.2A6.6 6.6 0 0 0 8 1.4zm0 2a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2zm0 2.6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg><span>Steering</span></a>
    </nav>
    <div class="rail-filter">
      <input id="filter" type="search" placeholder="Filter pages" aria-label="Filter pages"
             aria-describedby="filter-help" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <span class="sr-only" id="filter-help">The page list below narrows as you type.
        Press Enter to search the full text of every page.</span>
    </div>
    <span class="sr-only" id="filter-status" role="status"></span>
    <nav class="tree" id="tree" aria-label="Pages"></nav>
  </aside>
  <main id="main" tabindex="-1"><div class="empty">Loading…</div></main>
</div>
<div id="toasts" class="toasts" aria-live="polite" role="status"></div>
<div id="preview" class="preview-card" role="tooltip" hidden></div>
<button id="to-top" class="to-top" hidden aria-label="Back to top">↑</button>

<script src="/ui/sources.js" defer></script>
<script src="/ui/app.js" defer></script>
</body>
</html>
