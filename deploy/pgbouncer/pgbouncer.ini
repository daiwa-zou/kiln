; PgBouncer in front of kiln, in transaction mode.
;
; Shared by docker-compose.yml, `make test-pooled` and CI's pooled legs, which
; all start it through start.sh beside this file. The Helm chart renders the
; same settings from values (templates/pooler.yaml), and scripts/helm-assert.sh
; checks that the security-relevant keys agree with this file.
;
; kiln is pooler-safe in transaction mode: nothing it does outlives a
; transaction (internal/store/sessionstate_test.go pins that), migrations use a
; transaction-scoped advisory lock, and pooled deployments set
; database.query_exec_mode = cache_describe so no named prepared statement is
; left on a server connection.

[databases]
; Written by start.sh from PGBOUNCER_DB_*: which Postgres to forward to differs
; per environment, everything below does not.
%include /tmp/pgbouncer/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Plain-text passwords in a userlist that start.sh writes at container start,
; so no credential lives in this file or in the image. PgBouncer still speaks
; SCRAM to both kiln and Postgres.
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt

pool_mode = transaction
; Lets pgx's default exec mode (named, cached prepared statements) work too:
; PgBouncer tracks and re-prepares them per server connection. kiln's pooled
; default, cache_describe, does not need it.
max_prepared_statements = 200
; Sent by some clients at startup; PgBouncer would otherwise refuse them.
ignore_startup_parameters = extra_float_digits

; Server connections per database/user pair. A pooled client holds one only
; for the length of a transaction, so this bounds concurrent transactions, not
; connected clients. See docs/deployment.md for the sizing arithmetic.
default_pool_size = 20
reserve_pool_size = 5
max_client_conn = 400
; A client queued this long for a server connection gets an error rather than
; waiting forever behind an exhausted pool.
query_wait_timeout = 30
; One packet is one query or one result row. Above what kiln's own caps let
; into a single value (32 MiB extracted text, upload bodies), far below the
; 2 GiB default, so one oversized packet cannot make PgBouncer buffer
; gigabytes. The wiki log artifact is the exception: it grows without bound,
; and a log row past this size would be refused (a known follow-up).
max_packet_size = 67108864
; A client that has not finished logging in by then is dropped, so a pile of
; half-open connections cannot hold max_client_conn slots.
client_login_timeout = 10
; PgBouncer to Postgres. prefer suits compose and CI, whose Postgres has no
; TLS; start.sh sets it from PGBOUNCER_SERVER_TLS_SSLMODE. The Helm chart
; defaults to require.
server_tls_sslmode = prefer
