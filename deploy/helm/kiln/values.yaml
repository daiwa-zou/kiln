# Default values for kiln.
#
# The API and the build workers are configured separately because they scale
# on different signals. The API scales with readers; the workers scale with
# how much building you want done at once. The scheduler is a single pod.

image:
  repository: ghcr.io/daiwa-zou/kiln
  # Overrides the chart's appVersion. Pin a digest in production:
  #   tag: ""
  #   digest: sha256:...
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- application configuration ----------------------------------------------
config:
  # External URL, used for OAuth callbacks and generated links.
  publicURL: ""
  logLevel: info
  # "token" is the only defensible deployment value: "none" makes every caller
  # an admin, and kiln refuses it on a non-loopback bind anyway.
  authMode: token
  # The role `kiln admin token create --org` gives a membership it creates:
  # "member" or "viewer". Empty keeps kiln's default, member. Existing
  # memberships keep their role, and --admin tokens bypass it. Only the
  # process running `token create` reads it: set here, it reaches a
  # `kubectl exec` into these pods, not a token minted from your laptop.
  authDefaultRole: ""
  corsOrigins: []
  # CIDRs (or bare IPs) of the proxies in front of the API -- the ingress
  # controller's pod or Service IPs and the load balancer's addresses, never
  # the whole cluster pod CIDR (every pod is in it). Their X-Forwarded-For
  # is believed when rate-limiting unauthenticated callers; empty keys on the
  # TCP peer, which behind an ingress is the ingress for everyone. List only
  # proxies that append the address they received from, and every hop.
  trustedProxies: []

  # Prometheus metrics on their own listener, never behind the API's ingress:
  # queue depth and spend describe the deployment, not a tenant. Empty
  # disables the listener entirely. Stated explicitly because kiln's own default
  # is loopback-only, which Prometheus could not scrape from another pod.
  metricsAddr: ":9090"

  database:
    # Either a full URL (via existingSecret, preferably) or discrete fields.
    # With pooler.enabled the discrete fields are required: they are what the
    # pooler forwards to, and the migrate Job's direct connection.
    host: ""
    port: 5432
    name: kiln
    user: kiln
    # Also what the API and workers use towards the pooler when it is enabled.
    # require encrypts but does not verify the server; for verification mount
    # a CA and use verify-ca or verify-full with sslrootcert.
    sslmode: require
    # Per-replica pool sizes without a pooler. With pooler.enabled the chart
    # uses pooler.apiMaxConns / pooler.workerMaxConns instead.
    maxConns: 20
    workerMaxConns: 6

  storage:
    # s3 for anything multi-node: a worker cannot stage a document written to
    # another node's filesystem. fs is single-node only.
    backend: s3
    bucket: kiln
    region: us-east-1
    endpoint: ""
    # Leave access/secret keys unset to use the pod's identity -- IRSA on EKS,
    # Workload Identity on GKE, or an instance role. That is the right answer
    # on every managed cloud, and one fewer secret to rotate.
    pathStyle: false
    useSSL: true
    # Only for backend: fs.
    fsPath: /var/lib/kiln/blobs

  agent:
    runner: api
    model: ""
    runBudgetUSD: 5.00
    maxPagesPerRun: 25
    budgetWindow: 720h

  worker:
    pollInterval: 5s
    # How long a claimed run may go without a heartbeat before it is presumed
    # orphaned and requeued. Workers heartbeat every minute for as long as a
    # build lives, so this bounds dead-worker recovery, not build length.
    staleAfter: 15m
    # SIGTERM starts a drain rather than an abort; give an in-flight build
    # room to land. Keep terminationGracePeriodSeconds above this.
    drainGrace: 4m
    sourcePollInterval: 10m
    # Allowlist for local-path connectors. Empty denies every local path,
    # which is the right default: connector configs are API-writable data.
    permittedSourceRoots: []

  github:
    clientID: ""
    appID: ""

# --- secrets ----------------------------------------------------------------
# Strongly prefer an existing secret managed by your platform (External
# Secrets, Sealed Secrets, a cloud secret manager CSI driver) over inline
# values, which land in the release and in `helm get values`.
secrets:
  # A secret with any of: master-key, anthropic-api-key, database-url,
  # database-password, storage-secret-key, github-client-secret,
  # github-private-key, github-webhook-secret.
  existingSecret: ""
  # Inline fallback for evaluation only. Rendered into a Secret object.
  create: false
  masterKey: ""
  anthropicAPIKey: ""
  databaseURL: ""
  databasePassword: ""
  storageSecretKey: ""

# --- API --------------------------------------------------------------------
api:
  replicaCount: 2
  # The API is stateless -- sessions live in Postgres -- so replicas need no
  # affinity and any pod can serve any request.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
  # Uploads stream up to 32 MiB; the route already runs outside the standard
  # request timeout. Raise your ingress body limit to match.
  maxUploadMB: 33

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: 33m
  hosts:
    - host: kiln.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --- workers ----------------------------------------------------------------
worker:
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 20
    # CPU is a poor proxy for a queue of LLM-bound builds -- a waiting worker
    # is idle, not busy. Scale on queue depth instead once kiln's /metrics is
    # scraped and adapted; see docs/deployment.md.
    targetCPUUtilizationPercentage: 70
  # Above worker.drainGrace, so a rolling update lets in-flight builds land
  # instead of requeueing paid-for work.
  terminationGracePeriodSeconds: 300
  # Whether workers run the periodic duties (KILN_WORKER_SCHEDULER_DUTIES).
  # auto follows scheduler.enabled: off when the scheduler pod runs them. The
  # workers give the duties up as soon as their new pods start, before the
  # scheduler is known to be Ready, so a deployment without `helm upgrade
  # --wait` (Argo CD, Flux) should upgrade in two steps: set true, wait for
  # the scheduler to go Ready, then return to auto. true keeps the duties in
  # every worker beside the scheduler (duplicate work, never corruption).
  schedulerDuties: auto
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics

# --- scheduler --------------------------------------------------------------
# One pod running the periodic duties for the whole deployment: requeueing
# runs whose worker died, enqueueing poll-triggered sources, the hourly GC
# sweep (with pending blob deletes), and the kiln_queue_depth gauge. Enabled,
# it also turns those duties off in the workers (KILN_WORKER_SCHEDULER_DUTIES
# =false), so workers only claim and build.
#
# Disabled, the workers run the duties themselves, as every release before
# this one did. That is the fallback if the scheduler cannot run; nothing else
# needs to change. Always replicas 1 with a Recreate rollout, and no PDB or
# HPA: a second scheduler only duplicates idempotent work.
scheduler:
  enabled: true
  # Its database pool. One duty query at a time per duty; single digits with
  # or without the pooler.
  maxConns: 2
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics

# --- connection pooler ------------------------------------------------------
# PgBouncer in transaction mode between the API/workers and Postgres, so adding
# replicas adds pooler clients rather than Postgres backends. Off by default;
# RDS Proxy or another transaction pooler works too (leave this off and point
# config.database.host at it, with KILN_DATABASE_QUERY_EXEC_MODE=cache_describe).
#
# Enabling it routes the API and workers through the pooler with
# query_exec_mode cache_describe and single-digit pools, while the migrate Job
# keeps connecting to config.database.host directly: it runs as a pre-install
# hook, before the pooler exists. Requires config.database.host and a
# database-password key in the secret. A database-url key bypasses the pooler,
# so secrets.databaseURL is refused here; see docs/deployment.md for sizing.
pooler:
  enabled: false
  image:
    repository: edoburu/pgbouncer
    tag: v1.26.0-p0
    # PgBouncer 1.26.0. Older releases carry unauthenticated-crash CVEs; do not
    # pin below 1.26.0.
    digest: sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    pullPolicy: IfNotPresent
  replicas: 2
  # Server connections per pooler pod. Every pod opens its own pool, so
  # Postgres sees replicas x (defaultPoolSize + reservePoolSize) at most.
  defaultPoolSize: 25
  reservePoolSize: 5
  maxClientConn: 400
  # Per-replica kiln pools when pooled. A pooled connection is held only for a
  # transaction, so these bound concurrent transactions per pod.
  apiMaxConns: 8
  workerMaxConns: 4
  # PgBouncer to Postgres. require encrypts; verify-full also checks the
  # server's certificate against serverTLS.caSecretName (key ca.crt).
  serverTlsSslmode: require
  serverTLS:
    caSecretName: ""
  # kiln to PgBouncer. A kubernetes.io/tls Secret (cert-manager, say). Unset,
  # the chart generates a self-signed one on first install and reuses it on
  # upgrade; `helm template` without a cluster generates a fresh one each
  # render, so GitOps users should set this.
  tls:
    secretName: ""
  # Covers the preStop (5s, then PgBouncer's safe shutdown waiting for
  # in-flight transactions) plus the longest transaction kiln runs. Past it the
  # pod is killed and whatever is still running fails.
  terminationGracePeriodSeconds: 120
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
  # Rendered only with more than one replica.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# --- migrations -------------------------------------------------------------
migrations:
  # Runs `kiln admin migrate` as a pre-install/pre-upgrade hook. API and
  # workers refuse to start against an unexpected schema version, so this must
  # succeed before they roll.
  enabled: true
  backoffLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# --- pod security -----------------------------------------------------------
# Defaults satisfy the "restricted" Pod Security Standard. The image runs as
# uid 65532 and needs no write access outside its temp dirs.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  # For IRSA / Workload Identity:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::...:role/kiln
  annotations: {}
